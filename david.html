<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David - Meteo Profi Final V4</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-temp: #ffb142; --bg-rain: #2e86de; --bg-wind: #feca57;
            --temp-cold: #00d2ff; --temp-mid: #ffeb3b; --temp-hot: #ff0000;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; background: #1e272e; color: white; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .dashboard { display: flex; flex-direction: row; gap: 10px; width: 100%; max-width: 1400px; margin-bottom: 20px; }

        .card { 
            flex: 1; border-radius: 20px; padding: 20px; position: relative; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between;
            min-height: 180px;
        }

        .watermark { position: absolute; right: -10px; bottom: -10px; font-size: 8em; opacity: 0.12; transform: rotate(-15deg); pointer-events: none; }
        .temp-card { background: var(--bg-temp); }
        .rain-card { background: var(--bg-rain); }
        .wind-card { background: var(--bg-wind); color: #2d3436; }

        .title { font-size: 1em; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 10px; z-index: 1; }
        .main-row { display: flex; justify-content: space-between; align-items: baseline; z-index: 1; }
        
        .huge-temp { font-size: 4.5em; font-weight: 900; letter-spacing: -2px; }
        .decimal { font-size: 0.6em; font-weight: 700; }
        .huge-hum { font-size: 3.5em; font-weight: 700; opacity: 0.9; }
        .unit { font-size: 0.4em; margin-left: 2px; font-weight: 700; }

        .feels { margin-top: 10px; font-size: 1.6em; font-weight: 900; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; }

        .wind-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .compass { 
            width: 110px; height: 110px; border: 5px solid #2d3436; border-radius: 50%; 
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .arrow-wrapper {
            position: absolute; width: 100%; height: 100%;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .arrow-triangle {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid red;
        }

        .wind-speed-val { font-size: 1.8em; font-weight: 900; line-height: 1; }
        .extra-col { flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .extra-item { background: rgba(0,0,0,0.08); padding: 5px 10px; border-radius: 10px; font-weight: 900; font-size: 1.1em; display: flex; justify-content: space-between; }

        /* Styl pro patičku s názvem a časem */
        .footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); }
        .station-name { font-size: 2em; font-weight: 900; color: white; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .update-time { font-size: 1.1em; font-weight: 400; }

        @media (max-width: 900px) {
            .dashboard { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="card temp-card">
            <i class="fas fa-thermometer-half watermark"></i>
            <div class="title">TEPLOTA & VLHKOST</div>
            <div class="main-row">
                <div class="huge-temp" id="t-display">--<span class="unit">°C</span></div>
                <div class="huge-hum" id="h-display">--<span class="unit">%</span></div>
